B"], "real": "埃米尔／病患", "pos": "追击", "tags": ["本能驱动", "无惧", "兽性", "精神空洞", "温顺残影"], "desc": "被剥离恐惧、只剩本能的病患", "line": "你把恐惧剥掉了，剩下的是谁在替它走。"}}, "meta": {"guard": {"tagline": "先救人，再谈别的", "body": "在一局对局里，你的注意力总是先落在人身上：谁倒了、谁快没血、谁刚被骂了一句。你把“答应过的事”和“人在场”当作必须兑现的东西，哪怕代价是自己被放上椅子。你对“这总得有人管”特别敏感，也很难假装没看见。", "traits": ["出事时第一反应是顶上，而不是先算得失", "记人情，也记别人对你的辜负", "习惯用行动表达在乎，不太会说场面话"], "tip": "你容易把别人的责任也一起背走。把自己撑不住的那一刻也算进“该被照顾的人”里，会轻很多。"}, "calc": {"tagline": "先算清楚，再动手", "body": "你习惯把混乱先变成一张能读的表：谁在哪、还剩几台、下一步走哪。信息、顺序、位置是你的安全感来源。你不喜欢靠运气赢，也不喜欢把局面交到别人手上，宁可自己多担一点。", "traits": ["事前先列条件，事后一定复盘", "对“失控”的容忍度很低", "讲效率，也讲投入产出"], "tip": "算得越准，越容易低估人的不可控。给“没按计划来”的那部分留点余量，计划才不会一次崩完。"}, "genius": {"tagline": "只做到自己认的那一步", "body": "你有一件非要做到位的事，标准由自己定，别人认不认是另一回事。你能一个人钻进去很久，也能为一个别人看不出的小瑕疵重做十遍。这份较真让你真做出东西，也让你不太容易放过自己。", "traits": ["对细节的标准高于对结果的期待", "被否定时先不服，再回头自己较劲", "能独处很久，且不觉得孤独是问题"], "tip": "完美主义最容易变成拖延的借口。给“够用”划一条线，产出才追得上标准。"}, "show": {"tagline": "先让人看见，再谈别的", "body": "你熟悉场面的节奏：什么时候该热场，什么时候该退半步，什么时候一句话就能把气氛翻过来。你不太愿意把真实的疲惫摆上台面，更愿意把它包成一个段子。被看见对你是燃料，冷场是你的噩梦。", "traits": ["擅长读场，情绪切换很快", "用玩笑处理难受的事", "在意别人的反应，也在意自己给出的形象"], "tip": "长期只演不歇，会分不清哪一版是自己。留几个不需要表演的对象。"}, "lone": {"tagline": "一个人的时候最像自己", "body": "你对距离很敏感，靠近之前先判断对方会不会越界。你不需要热闹来证明什么，也不喜欢被安排。独处对你不是退，而是恢复。你对少数几个人有很深的忠诚，但那扇门开得很慢。", "traits": ["边界清楚，不喜欢被打扰", "观察多于参与，心里有一本账", "一旦认下谁，就很难换"], "tip": "“我一个人也行”说得太多次，会让想靠近的人不敢开口。偶尔主动一次就够了。"}, "wild": {"tagline": "身体先动，脑子后到", "body": "你相信第一下反应：危险来了是先跑、先扑，还是先伏低，你比谁都清楚。规则、场面话、客套对你来说都是多余的步骤。你要的是自由和边界，最受不了被圈住。", "traits": ["凭直觉行动，事后才复盘", "不怕硬碰，怕被管", "情绪来得直接，也散得快"], "tip": "本能很强、收尾偏弱。给自己留一个“先停三秒”的习惯，别人会更容易跟上你。"}, "fate": {"tagline": "有件事一直没放下", "body": "你心里有一件没做完、没等到、没弄明白的事，它影响了你很多选择。你能为它等很久，也能为它付出别人觉得不值的代价。别人劝你算了，你听进去了，但没有照做。", "traits": ["对“未完成”特别敏感", "能长期等一个不确定的结果", "愿意为在意的事付出超额代价"], "tip": "执念本身不是毛病，代价才要提前算。给自己设一个止损点，比硬撑更难得。"}}, "dim": {"guard": "义气", "calc": "谋算", "genius": "偏执", "show": "表演", "lone": "自守", "wild": "野性", "fate": "执念"}};
const state = { view:'start', gAns:[], bAns:[], group:null };
const LETTERS = ['A','B','C','D'];
const app = document.getElementById('app');

function render(){
  if(state.view==='start') renderStart();
  else if(state.view==='general') renderGeneral();
  else if(state.view==='branch') renderBranch();
  else renderResult();
}

function renderStart(){
  app.innerHTML = `
  <div class="title-block">
    <h1>你是第五人格<br>庄园里的谁？</h1>
    <div class="sub">12 道情境题先定你的性格族群，<br>再用 3 道题找出最像你的那位角色。<br>结果含性格光谱雷达图、匹配度与逐题解析。<br>全程约 3 分钟，凭第一反应作答即可。</div>
  </div>
  <div class="card" style="margin-top:26px;">
    <div class="qtext center">测一测，庄园里哪个人替你活过一遍</div>
    <button class="btn" onclick="startTest()">开始测试</button>
    <div class="disc">本测试为粉丝自制趣味内容，非官方测试，与网易及《第五人格》官方无关，不构成心理测评。</div>
  </div>`;
}

function startTest(){ state.gAns=[]; state.bAns=[]; state.group=null; state.view='general'; render(); }

function renderGeneral(){
  const i = state.gAns.length;
  if(i>=DATA.general.length){ finishGeneral(); return; }
  const q = DATA.general[i];
  const pct = Math.round(i/DATA.general.length*100);
  app.innerHTML = `
  <div class="card">
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="qno">第 ${i+1} / ${DATA.general.length} 题</div>
    <div class="qtext">${q.q}</div>
    ${q.options.map((o,idx)=>`
      <button class="opt" onclick="pickGeneral(${idx})">
        <span class="mark">${LETTERS[idx]}</span>${o.t}
      </button>`).join('')}
  </div>`;
}

function pickGeneral(idx){ state.gAns.push(idx); render(); }

const KEYS = ['guard','calc','genius','show','lone','wild','fate'];

function finishGeneral(){
  const score = {guard:0,calc:0,genius:0,show:0,lone:0,wild:0,fate:0};
  DATA.general.forEach((q,i)=>{
    const w = q.options[state.gAns[i]].w;
    for(const k in w) score[k]=(score[k]||0)+w[k];
  });
  state.score = score;
  let best = KEYS[0];
  KEYS.forEach(k=>{ if(score[k]>score[best]) best=k; });
  state.group = best;
  state.view='branch';
  render();
}

function renderBranch(){
  const qs = DATA.branch[state.group];
  const i = state.bAns.length;
  if(i>=qs.length){ finishBranch(); return; }
  const q = qs[i];
  const pct = Math.round(i/qs.length*100);
  app.innerHTML = `
  <div class="card">
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="qno">深入了解 · 第 ${i+1} / ${qs.length} 题</div>
    <div class="qtext">${q.q}</div>
    ${q.options.map((o,idx)=>`
      <button class="opt" onclick="pickBranch(${idx})">
        <span class="mark">${LETTERS[idx]}</span>${o}
      </button>`).join('')}
  </div>`;
}

function pickBranch(idx){ state.bAns.push(LETTERS[idx]); render(); }

function finishBranch(){
  const res = [];
  for(const name in DATA.chars){
    const c = DATA.chars[name];
    if(c.group!==state.group) continue;
    let sc=0;
    c.coords.forEach((co,j)=>{ if(state.bAns[j]===co) sc++; });
    res.push({name, sc, c});
  }
  res.sort((a,b)=>b.sc-a.sc || (a.name>b.name?1:-1));
  const top = res[0].sc;
  const winners = res.filter(r=>r.sc===top).slice(0,2);
  state.winners = winners;
  state.cands = res.slice(0,3);
  state.hits = top;
  state.view='result';
  render();
}

function radarSVG(score){
  const n = KEYS.length, R = 74, CX = 148, CY = 100;
  const maxv = Math.max.apply(null, KEYS.map(k=>score[k]||0)) || 1;
  const pt = (i,r)=>{ const a = -Math.PI/2 + i*2*Math.PI/n; return [CX+Math.cos(a)*r, CY+Math.sin(a)*r]; };
  let ring = '';
  [0.25,0.5,0.75,1].forEach(f=>{
    const p = KEYS.map((k,i)=>pt(i,R*f).map(x=>x.toFixed(1)).join(',')).join(' ');
    ring += `<polygon points="${p}" fill="none" stroke="#ded0b2" stroke-width="1"/>`;
  });
  let axes = '';
  KEYS.forEach((k,i)=>{ const [x,y]=pt(i,R); axes += `<line x1="${CX}" y1="${CY}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#ded0b2"/>`; });
  const pts = KEYS.map((k,i)=>{
    const v = Math.max(((score[k]||0)/maxv)*0.92, 0.1);
    return pt(i,R*v).map(x=>x.toFixed(1)).join(',');
  }).join(' ');
  let labels = '';
  KEYS.forEach((k,i)=>{
    const [x,y] = pt(i,R+15);
    const anchor = Math.abs(x-CX)<6 ? 'middle' : (x>CX ? 'start':'end');
    const dy = y < CY ? -2 : 9;
    const hi = score[k]===maxv && maxv>0;
    labels += `<text x="${x.toFixed(1)}" y="${(y+dy).toFixed(1)}" text-anchor="${anchor}" font-size="10.5" fill="${hi?'#3f4a54':'#8a7f66'}" font-weight="${hi?'700':'400'}">${DATA.dim[k]}</text>`;
  });
  return `<svg viewBox="0 -8 296 216" width="296" height="216" aria-label="性格光谱雷达图">
    ${ring}${axes}
    <polygon points="${pts}" fill="rgba(63,74,84,.22)" stroke="#3f4a54" stroke-width="2" stroke-linejoin="round"/>
    ${KEYS.map((k,i)=>{ const v=Math.max(((score[k]||0)/maxv)*0.92,0.1); const [x,y]=pt(i,R*v);
        return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#3f4a54"/>`; }).join('')}
    ${labels}
  </svg>`;
}

function renderResult(){
  const [main, second] = state.winners;
  const m = main.c;
  const meta = DATA.meta[state.group];
  const score = state.score;
  const maxv = Math.max.apply(null, KEYS.map(k=>score[k]||0)) || 1;
  const total = KEYS.reduce((s,k)=>s+(score[k]||0),0) || 1;
  const hitPct = Math.round(state.hits/3*100);
  const used = [main.name, second && second.name];
  const sibs = Object.entries(DATA.chars)
    .filter(([n,c])=>c.group===state.group && used.indexOf(n)<0)
    .slice(0,4).map(x=>x[0]);

  const bars = KEYS.map(k=>{
    const v = score[k]||0;
    const w = Math.max(Math.round(v/maxv*100), 4);
    return `<div class="bar-row ${v===maxv?'on':''}">
      <div class="bar-top"><span>${DATA.dim[k]}</span><span>${v} 分 · 占 ${Math.round(v/total*100)}%</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${w}%"></div></div>
    </div>`;
  }).join('');

  const cands = state.cands.map((r,i)=>{
    const t = r.c.tags.slice(0,2).join('、');
    return `<tr><td class="rk">${i+1}</td><td><b>${r.name}</b><br><span style="color:#8a7f66">${t}</span></td>
      <td class="pt">${Math.round(r.sc/3*100)}%</td></tr>`;
  }).join('');

  const rows = DATA.general.map((q,i)=>{
    const o = q.options[state.gAns[i]];
    const k = Object.keys(o.w).sort((a,b)=>o.w[b]-o.w[a]).map(x=>DATA.dim[x]).join('/');
    return `<tr><td class="rk">${i+1}</td><td>${o.t}</td><td class="pt">${k}</td></tr>`;
  }).join('');
  const brows = DATA.branch[state.group].map((q,i)=>{
    return `<tr><td class="rk">深${i+1}</td><td>${q.options[LETTERS.indexOf(state.bAns[i])]}</td><td class="pt">细选</td></tr>`;
  }).join('');

  app.innerHTML = `
  <div class="title-block">
    <h1>你在庄园里是</h1>
  </div>
  <div class="mcard" style="margin-top:14px;">
    <div class="result-group">${DATA.groups[state.group]} · ${meta.tagline}</div>
    <div class="result-name">${main.name}</div>
    ${m.line?`<div class="result-line">「${m.line}」</div>`:''}
    <div class="center" style="margin-top:12px;">${m.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
    <div class="result-desc">${m.desc}</div>
    <div class="kv" style="margin-top:6px;border-top:1px dashed #e0d3b6;padding-top:10px;"><span>档案身份</span><b>${m.real}</b></div>
    <div class="kv"><span>场上定位</span><b>${m.pos}</b></div>
    <div class="kv"><span>三题命中</span><b>${state.hits} / 3 · 匹配度 ${hitPct}%</b></div>
  </div>

  <div class="sec-h">你的性格光谱</div>
  <div class="mcard">
    ${radarSVG(score)}
    <div class="small" style="text-align:center;margin-top:2px;">七维相对强弱：越靠外的顶点，是你在 12 道题里越明显的倾向</div>
    <div class="bars" style="margin-top:14px;">${bars}</div>
    <div class="small">12 道题共打出 ${total} 分的权重，占比越高，代表你在这种处事方式上越稳定。</div>
  </div>

  <div class="sec-h">同为这一族的其他角色</div>
  <div class="mcard">
    <div class="match">
      <div class="dots">${[0,1,2].map(i=>`<span class="dot ${i<state.hits?'on':''}"></span>`).join('')}</div>
      <div class="match-num">${hitPct}<em>% 匹配</em></div>
    </div>
    <table style="margin-top:12px;">
      <tr><th style="width:30px;">#</th><th>角色</th><th style="text-align:right;">匹配度</th></tr>
      ${cands}
    </table>
    <div class="small">匹配度＝你在三题分支题上与这位角色落点重合的比例。同分时按角色顺序给出主结果与备选，不做随机抽取。</div>
  </div>

  <div class="sec-h">为什么是 TA</div>
  <div class="mcard">
    <div class="ana-h">${DATA.groups[state.group]}｜${meta.tagline}</div>
    <div class="ana-tag">${state.group==='guard'?'先看人，再看局':''}${state.group==='calc'?'先把局面读成一张表':''}${state.group==='genius'?'标准自己定':''}${state.group==='show'?'先立住场面':''}${state.group==='lone'?'先看边界':''}${state.group==='wild'?'先信身体':''}${state.group==='fate'?'先认那件没放下的事':''}</div>
    <div class="ana-p">${meta.body}</div>
    <div class="ana-h" style="margin-top:16px;">你身上的三面</div>
    ${meta.traits.map(t=>`<div class="ana-li">${t}</div>`).join('')}
    <div class="ana-tip">${meta.tip}</div>
  </div>

  <div class="sec-h">你和 ${main.name} 的重合处</div>
  <div class="mcard">
    <div class="ana-p">${m.desc}。你的三题选择里有 ${state.hits} 处落在 TA 的同一坐标上，说明你们在关键分歧点的取舍是同一套：遇到事先动哪一步、把什么放在代价前面，都一样。</div>
    ${m.tags.slice(0,3).length?`<div class="ana-li">TA 身上最像你的标签：${m.tags.slice(0,3).join('、')}</div>`:''}
    ${second?`<div class="ana-li">若你觉得不够贴，最接近的备选是 ${second.name}。</div>`:''}
    <button class="btn ghost" onclick="toggleReplay()" style="margin-top:14px;">查看我的 15 个选择</button>
    <div id="replay" style="display:none;margin-top:12px;">
      <table>
        <tr><th style="width:30px;">题</th><th>你选的</th><th style="text-align:right;">指向</th></tr>
        ${rows}${brows}
      </table>
    </div>
  </div>

  <div class="sec-h">这一族还有谁</div>
  <div class="mcard">
    <div class="ana-p">${sibs.length?sibs.join('、')+'——同属「'+DATA.groups[state.group]+'」，但各自站在不同的那一侧。':''}</div>
    <button class="btn" onclick="location.reload()" style="margin-top:16px;">再测一次</button>
    <div class="disc">本测试为粉丝自制趣味内容，非官方测试，与网易及《第五人格》官方无关，不构成心理测评。结果仅代表本题库的趣味设定，不等同于任何人格测评工具。</div>
  </div>`;
}

function toggleReplay(){
  const el = document.getElementById('replay');
  el.style.display = el.style.display==='none' ? 'block' : 'none';
}

render();
</script>
</body>
</html>
